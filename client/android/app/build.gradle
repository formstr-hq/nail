apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Cross-compile the notifier Rust crate and (re)generate its Kotlin bindings
// before any source is compiled, so a clean checkout yields the .so + bindings.
task buildNotifier(type: Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', "${rootProject.projectDir}/../scripts/build-notifier.sh"
}
preBuild.dependsOn buildNotifier

android {
    namespace "com.formstr.mail"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.formstr.mail"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two distributions of the same app, with different payment rails:
    //   direct  the Zapstore / sideloaded APK: Lightning + card (hosted
    //           Checkout). No Google services and no Play Billing at all.
    //   play    the Play Store build: in-app purchases only. No Lightning, no card.
    // The web bundle and the native plugins must match the flavor: build with
    // `pnpm run build` for direct and `pnpm run build:store` for play (the
    // tasks below refuse to package a bundle of the other kind).
    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
        }
        play {
            dimension "distribution"
        }
    }
    buildTypes {
        debug {
            // Debug builds install alongside the production app instead of
            // replacing it: a distinct applicationId is a distinct app to
            // Android. The Java namespace stays com.formstr.mail, so
            // MainActivity and the notifier bindings are untouched.
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        // Match Capacitor's Java target (capacitor.build.gradle → VERSION_21).
        jvmTarget = "21"
    }
}

// Distribution guards: a Lightning/card bundle must never be packaged as a
// store build (and the reverse). scripts/check-store-bundle.mjs reads
// www/.build-channel, scans the whole bundle and the native project.
def clientDir = rootProject.projectDir.parentFile
tasks.register('checkStoreBundle', Exec) {
    workingDir clientDir
    commandLine 'node', 'scripts/check-store-bundle.mjs', '--mode', 'store'
}
tasks.register('checkOpenBundle', Exec) {
    workingDir clientDir
    commandLine 'node', 'scripts/check-store-bundle.mjs', '--mode', 'open'
}
tasks.matching { it.name ==~ /^pre(Direct)\w*Build$/ }.configureEach { dependsOn 'checkOpenBundle' }
tasks.matching { it.name ==~ /^pre(Play)\w*Build$/ }.configureEach { dependsOn 'checkStoreBundle' }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // JNA backs the notifier UniFFI bindings; the @aar variant ships the .so's.
    implementation "net.java.dev.jna:jna:5.14.0@aar"
    // WorkManager runs the periodic background mail poll.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
