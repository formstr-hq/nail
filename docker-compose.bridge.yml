# Standalone dev compose for nail.
#
# Starts the nostr-bridge wired to a local mock relay — no mailcow required.
# The bridge receives mail via LMTP on port 2400 (internal).
#
# Required env vars (create a .env file or export before running):
#   NOSTR_BRIDGE_NSEC   — nsec1... or 64-char hex private key for the bridge identity
#
# Optional env vars:
#   BRIDGE_DOMAIN       — domain the bridge handles (default: nostr-forward.local)
#   LMTP_PORT           — LMTP listen port inside the container (default: 2400)
#
# Usage:
#   docker compose up -d --build
#   RELAY_URL=ws://127.0.0.1:4600 pnpm test   (inside e2e-nostr/)

services:
  nostr-mock-relay:
    build:
      context: e2e-nostr
      dockerfile: Dockerfile.relay
    ports:
      - "127.0.0.1:4600:4600"
    restart: unless-stopped
    networks:
      - nail-network

  nostr-bridge:
    build: ./nostr-bridge
    container_name: nostr-bridge-nail
    restart: unless-stopped
    depends_on:
      - nostr-mock-relay
    environment:
      - NOSTR_BRIDGE_NSEC=${NOSTR_BRIDGE_NSEC}
      - BRIDGE_DOMAIN=${BRIDGE_DOMAIN:-nostr-forward.local}
      - LOCAL_DOMAINS=${LOCAL_DOMAINS:-nostr-forward.local}
      - BOOTSTRAP_RELAYS=ws://nostr-mock-relay:4600
      - BRIDGE_RELAYS=ws://nostr-mock-relay:4600
      - NIP05_BASE_URL=http://host.docker.internal:4500
      - POSTFIX_HOST=host.docker.internal
      - POSTFIX_PORT=25
      # Internal mail-send API — reachable on nail-network by trusted callers
      # (e.g. formstr-backend for welcome mail). Unset the key to disable it.
      - SEND_API_KEY=${SEND_API_KEY}
      - SEND_API_PORT=2500
      # Receive-path watchdog: every HEALTH_INTERVAL_MS the bridge gift-wraps a
      # health ping to itself and waits HEALTH_TIMEOUT_MS for it to round-trip;
      # on failure it exits and restart:unless-stopped restarts it. /healthz on
      # HEALTH_PORT reflects the last result for the Docker HEALTHCHECK. Lower
      # HEALTH_INTERVAL_MS to exercise the self-heal in e2e tests.
      - HEALTH_INTERVAL_MS=${HEALTH_INTERVAL_MS:-3600000}
      - HEALTH_TIMEOUT_MS=${HEALTH_TIMEOUT_MS:-30000}
      - HEALTH_PORT=2510
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nail-network

networks:
  nail-network:
    driver: bridge
