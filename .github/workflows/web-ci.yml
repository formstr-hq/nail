name: Web CI

# Runs on every push / PR that touches the frontend or the shared protocol it
# imports. CI is the verification gate: build + test + lint at the commit you cite.
on:
  push:
    paths:
      - 'client/web/**'
      - 'client/scripts/**'
      - 'client/capacitor.config.ts'
      - 'client/package.json'
      - 'nostr-bridge/src/protocol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'client/web/**'
      - 'client/scripts/**'
      - 'client/capacitor.config.ts'
      - 'client/package.json'
      - 'nostr-bridge/src/protocol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # One workspace install covers client/web + the native shell;
      # --frozen-lockfile makes lockfile drift a build failure rather than a
      # silent re-resolve.
      - name: Install
        run: pnpm install --frozen-lockfile

      # nostr-bridge and e2e-nostr are separate pnpm projects with their own
      # lockfiles; client/web's tests and the e2e relay need their deps.
      - name: Install nostr-bridge deps
        run: pnpm --dir nostr-bridge install --frozen-lockfile

      - name: Install e2e-nostr deps
        run: pnpm --dir e2e-nostr install --frozen-lockfile

      - name: Lint
        run: pnpm --filter mailstr-web lint

      - name: Test
        run: pnpm --filter mailstr-web test

      - name: Build
        run: pnpm --filter mailstr-web build

      # Store builds (Play / App Store) must contain no Lightning and no card
      # code. Build each kind of bundle, sync the native project for it, and let
      # the guard scan the whole output.
      - name: Store bundle has no Lightning or card code
        run: |
          pnpm --filter mailstr-client run build:web:store
          pnpm --filter mailstr-client run sync:store
          pnpm --filter mailstr-client run check:store

      - name: Open bundle still has Lightning and card
        run: |
          pnpm --filter mailstr-client run build:web
          pnpm --filter mailstr-client run sync
          pnpm --filter mailstr-client run check:open

      - name: Install Playwright browser
        run: pnpm --filter mailstr-web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter mailstr-web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/web/playwright-report/
          if-no-files-found: ignore
