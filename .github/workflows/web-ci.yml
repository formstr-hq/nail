name: Web CI

# Runs on every push / PR that touches the frontend or the shared protocol it
# imports. The verification checklist in AGENTS.md ("build + test + lint at the
# commit you cite") has no meaning without this.
on:
  push:
    paths:
      - 'client/web/**'
      - 'nostr-bridge/src/protocol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'client/web/**'
      - 'nostr-bridge/src/protocol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # One workspace install covers client/web + the native shell;
      # --frozen-lockfile makes lockfile drift a build failure rather than a
      # silent re-resolve.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter mailstr-web lint

      - name: Test
        run: pnpm --filter mailstr-web test

      - name: Build
        run: pnpm --filter mailstr-web build

      - name: Install Playwright browser
        run: pnpm --filter mailstr-web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter mailstr-web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/web/playwright-report/
          if-no-files-found: ignore
