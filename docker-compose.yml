services:
  web-deploy:
    # Merged frontend: prerendered landing at /, mail app at /mails — one
    # image, one dist directory for the external nginx.
    build:
      # Repo root, so the shared nostr-bridge protocol module is in context.
      context: .
      dockerfile: client/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.formstr.app}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://api.formstr.app}
        VITE_API_CANONICAL_BASE_URL: ${VITE_API_CANONICAL_BASE_URL:-}
        VITE_MAIL_DOMAIN: ${VITE_MAIL_DOMAIN:-mailstr.app}
        VITE_MAILS_URL: ${VITE_MAILS_URL:-/mails}
        # Outbound/verification bridge domain; must match the deployment
        # (stg.mailstr.app on staging). Unset = the app's mailstr.app default.
        VITE_BRIDGE_DOMAIN: ${VITE_BRIDGE_DOMAIN:-mailstr.app}
    container_name: mailstr-web-deploy
    volumes:
      - ${WEB_DIST_PATH:?set WEB_DIST_PATH in .env}:/output
    restart: "no"