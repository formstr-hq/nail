<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Flag JS as available before first paint, so scroll-reveal styles only
         hide content when JS can animate it back in. No-JS users and crawlers
         keep everything visible, and there's no reveal flash on load. -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- IMPORTANT: set this to the real deployed origin (canonical, OG & sitemap) -->
    <link rel="canonical" href="https://mailstr.app/" />

    <title>Mail by Formstr — Email only your key can open. you@mailstr.app</title>
    <meta
      name="description"
      content="Claim you@mailstr.app and mail to it is encrypted to your key and stored on relays you choose. Whoever routes your mail can't read it, and there's no password to steal. Pay once with Lightning."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Formstr" />
    <meta
      name="keywords"
      content="Mail by Formstr, Mailstr, Nostr, Nostr email, email bridge, NIP-05, encrypted email, decentralized email, private email, Lightning payment, mailstr.app, Formstr"
    />

    <!-- icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mail by Formstr" />
    <meta property="og:url" content="https://mailstr.app/" />
    <meta
      property="og:title"
      content="Mail by Formstr — Email only your key can open. you@mailstr.app"
    />
    <meta
      property="og:description"
      content="Mail to you@mailstr.app is encrypted to your key and stored on relays you choose. Whoever routes it can't read it, and there's no password. Pay once with Lightning."
    />
    <meta property="og:image" content="https://mailstr.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mail by Formstr — email only your key can open. Mail to you@mailstr.app is encrypted to your key and stored on relays you choose."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mail by Formstr — Email only your key can open. you@mailstr.app"
    />
    <meta
      name="twitter:description"
      content="Mail to you@mailstr.app is encrypted to your key and stored on relays you choose. Whoever routes it can't read it, and there's no password."
    />
    <meta name="twitter:image" content="https://mailstr.app/og-image.png" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mailstr.app/#org",
            "name": "Formstr",
            "url": "https://mailstr.app/",
            "description": "Decentralized, privacy-first productivity tools built on the Nostr protocol.",
            "sameAs": ["https://github.com/formstr-hq", "https://formstr.app", "https://about.formstr.app"]
          },
          {
            "@type": "WebSite",
            "@id": "https://mailstr.app/#website",
            "url": "https://mailstr.app/",
            "name": "Mail by Formstr",
            "publisher": { "@id": "https://mailstr.app/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Mail by Formstr",
            "applicationCategory": "CommunicationApplication",
            "operatingSystem": "Web",
            "url": "https://mailstr.app",
            "description": "An email service where mail to you@mailstr.app is encrypted to your key and stored on relays you choose — the routing bridge can't read it, and there's no password. NIP-05 identity included. Paid once via Lightning."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Mail by Formstr — email only your key can open</h1>
      <p>
        Claim you@mailstr.app and mail sent to it is encrypted to your key and
        stored on relays you choose. Whoever routes your mail can't read it, and
        there's no password to steal. Pay once with Lightning. Signing up
        requires JavaScript; enable it to claim your address.
      </p>
      <ul>
        <li><a href="/mails">Open your Mail by Formstr inbox</a></li>
        <li><a href="/privacy-policy">Privacy policy</a></li>
        <li><a href="https://about.formstr.app">The Formstr suite</a></li>
        <li><a href="https://github.com/formstr-hq">Formstr on GitHub</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
